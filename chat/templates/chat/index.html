{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-title" content="IO">
  <link rel="icon" type="image/png" href="{% static 'chat/favicon.png' %}?v=4">
  <link rel="apple-touch-icon" href="{% static 'chat/pwa-192.png' %}">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IO - The Guardian Wisp</title>
  <link rel="manifest" href="{% static 'chat/manifest.json' %}">
  <meta name="theme-color" content="#060c1d">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --cyan: #5ee7ff;
      --blue: #2f7bff;
      --gold: #ffd36a;
      --red: #ff7a7a;
      --deep: #050a18;
      --panel: rgba(10, 20, 45, .72);
      --line: rgba(94, 231, 255, .18);
      --text: #e6f4ff;
      --muted: #8aa4c8;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(47, 123, 255, .28), transparent 60%),
        radial-gradient(800px 500px at 100% 110%, rgba(94, 231, 255, .18), transparent 60%),
        linear-gradient(180deg, #050a18 0%, #081330 100%);
      background-attachment: fixed;
      overflow: hidden;
    }
    #sparks { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ---------- Layout ---------- */
    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
      background: rgba(5, 10, 24, .55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    /* ---------- Header ---------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(94, 231, 255, .07), transparent);
    }
    .orb { position: relative; width: 50px; height: 50px; display: grid; place-items: center; flex-shrink: 0; }
    .orb::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, var(--cyan) 35%, transparent 70%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      animation: spin 6s linear infinite;
      opacity: .6;
      transition: opacity .4s;
    }
    .orb img {
      width: 40px; height: 40px;
      object-fit: contain;
      background: transparent;
      border: none;
      filter: drop-shadow(0 0 8px rgba(94, 231, 255, .75));
      animation: float 4s ease-in-out infinite;
    }
    .orb.thinking::before { animation-duration: 1.1s; opacity: 1; background: conic-gradient(from 0deg, transparent 0%, var(--gold) 35%, transparent 70%); }
    .orb.thinking img { animation-duration: 1.3s; filter: drop-shadow(0 0 12px rgba(255, 211, 106, .9)); }

    .brand { line-height: 1.1; }
    .brand .name { font-size: 20px; font-weight: 700; letter-spacing: 3px; text-shadow: 0 0 14px rgba(94, 231, 255, .6); }
    .brand .tag { font-size: 12px; color: var(--muted); margin-top: 3px; letter-spacing: .5px; }

    .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .status {
      --pc: #8defff; --pb: rgba(94, 231, 255, .35); --pbg: rgba(94, 231, 255, .08);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .3px;
      color: var(--pc);
      border: 1px solid var(--pb);
      background: var(--pbg);
      transition: color .4s, border-color .4s, background .4s;
    }
    .status[data-state="thinking"] { --pc: #ffe3a1; --pb: rgba(255, 211, 106, .5); --pbg: rgba(255, 211, 106, .1); }
    .status[data-state="offline"]  { --pc: #ffa3a3; --pb: rgba(255, 122, 122, .5); --pbg: rgba(255, 122, 122, .1); }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 9px currentColor; animation: pulse 2.2s ease-in-out infinite; }
    .status[data-state="thinking"] .dot { animation-duration: .7s; }
    .status[data-state="offline"] .dot { animation: none; opacity: .8; }
    .dots { display: none; }
    .dots.show { display: inline-flex; gap: 2px; margin-left: -4px; }
    .dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; animation: bounce 1.1s infinite; margin-top: 7px; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }

    .btn-clear {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      transition: all .25s;
    }
    .btn-clear:hover:not(:disabled) { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px rgba(94, 231, 255, .25); }
    .btn-clear:disabled { opacity: .4; }

    /* ---------- Offline banner (slides smoothly) ---------- */
    .offline-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s ease; }
    .offline-wrap.show { grid-template-rows: 1fr; }
    .offline-wrap > div { overflow: hidden; }
    .offline-bar {
      padding: 9px 16px;
      text-align: center;
      font-size: 13px;
      color: #ffc2c2;
      background: rgba(255, 122, 122, .12);
      border-bottom: 1px solid rgba(255, 122, 122, .3);
    }

    /* ---------- Messages ---------- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 8px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(94, 231, 255, .2); border-radius: 8px; }

    .msg { max-width: 86%; animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
    .msg .meta { font-size: 11px; color: var(--muted); margin: 0 8px 4px; letter-spacing: .3px; }
    .bubble { padding: 11px 15px; border-radius: 18px; line-height: 1.55; font-size: 15px; word-wrap: break-word; }

    .msg.user { align-self: flex-end; }
    .msg.user .meta { text-align: right; }
    .msg.user .bubble {
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-bottom-right-radius: 5px;
      box-shadow: 0 6px 22px rgba(37, 99, 235, .35);
    }

    .msg.model {
      align-self: flex-start;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      column-gap: 10px;
    }
    .avatar {
      grid-column: 1; grid-row: 1 / span 2; align-self: end;
      width: 36px; height: 36px;
      object-fit: contain;
      background: transparent;
      border: none;
      filter: drop-shadow(0 0 7px rgba(94, 231, 255, .7));
    }
    .msg.model .meta, .msg.model .bubble { grid-column: 2; }
    .msg.model .bubble {
      justify-self: start;
      background: var(--panel);
      border: 1px solid var(--line);
      border-bottom-left-radius: 5px;
      box-shadow: 0 0 26px rgba(94, 231, 255, .07);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .msg.model.fresh .bubble { animation: glowIn 1.2s ease-out; }

    .msg.error { align-self: center; max-width: 90%; }
    .msg.error .bubble {
      background: rgba(255, 122, 122, .12);
      border: 1px solid rgba(255, 122, 122, .4);
      color: #ffc2c2;
      font-size: 14px;
      border-radius: 14px;
    }
    .msg.error .meta { text-align: center; }

    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 20px; }
    .bubble li::marker { color: var(--cyan); }
    .bubble strong { color: #bff4ff; }
    .bubble code { background: rgba(94, 231, 255, .12); color: #bff4ff; padding: 1px 6px; border-radius: 6px; font-size: 13px; }
    .bubble pre { background: rgba(2, 6, 18, .85); border: 1px solid var(--line); padding: 11px 13px; border-radius: 12px; overflow-x: auto; margin: 0 0 8px; }
    .bubble pre code { background: none; padding: 0; }

    /* Thinking bubble */
    .think { display: inline-flex; align-items: center; gap: 10px; padding: 2px 0; }
    .think-text {
      font-weight: 600;
      letter-spacing: .4px;
      background: linear-gradient(90deg, var(--muted) 0%, var(--cyan) 40%, var(--gold) 60%, var(--muted) 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 1.8s linear infinite;
    }
    .think .d { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: bounce 1.1s infinite; }
    .think .d:nth-of-type(2) { animation-delay: .15s; }
    .think .d:nth-of-type(3) { animation-delay: .3s; }

    /* ---------- Chips & composer ---------- */
    #chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 12px; transition: opacity .3s; }
    #chips::-webkit-scrollbar { display: none; }
    #chips.off { opacity: .4; pointer-events: none; }
    #chips button {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: rgba(94, 231, 255, .05);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 15px;
      font-size: 13px;
      transition: transform .2s, border-color .2s, box-shadow .2s, color .2s;
    }
    #chips button:hover { transform: translateY(-2px); border-color: var(--cyan); color: var(--cyan); box-shadow: 0 4px 16px rgba(94, 231, 255, .2); }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 18px 12px;
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, rgba(94, 231, 255, .05), transparent);
    }
    #prompt {
      flex: 1;
      resize: none;
      max-height: 140px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(3, 8, 22, .8);
      color: var(--text);
      padding: 11px 15px;
      font-size: 15px;
      transition: border-color .25s, box-shadow .25s;
    }
    #prompt::placeholder { color: #5f7899; }
    #prompt:focus { outline: none; background: rgba(3, 8, 22, .9); color: var(--text); border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(94, 231, 255, .15), 0 0 20px rgba(94, 231, 255, .15); }
    #prompt:disabled { opacity: .6; }
    #send {
      border: none;
      color: #02101f;
      font-weight: 700;
      border-radius: 16px;
      padding: 11px 22px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 6px 20px rgba(47, 123, 255, .4);
      transition: transform .2s, box-shadow .2s, opacity .3s, filter .3s;
    }
    #send:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(94, 231, 255, .45); }
    #send:active:not(:disabled) { transform: scale(.96); }
    #send:disabled { opacity: .45; filter: saturate(.5); box-shadow: none; }
    .footer { text-align: center; font-size: 11px; color: #5f7899; padding: 0 0 12px; letter-spacing: .4px; }

    /* idle-avatar */
    .orb { width: 56px; height: 56px; }
    .orb img { width: 46px; height: 46px; animation: idle 5s ease-in-out infinite, glow 3s ease-in-out infinite; }
    .orb.thinking img { animation: idle 1.4s ease-in-out infinite, glowGold 1s ease-in-out infinite; }
    .orbit { position: absolute; inset: -6px; animation: spin 7s linear infinite; pointer-events: none; }
    .orb.thinking .orbit { animation-duration: 1.8s; }
    .orbit i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .orbit i:nth-child(1) { top: 0; left: 50%; }
    .orbit i:nth-child(2) { bottom: 8%; left: 12%; width: 4px; height: 4px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    .orbit i:nth-child(3) { bottom: 8%; right: 12%; width: 3px; height: 3px; }
    .avatar { animation: idle 5s ease-in-out infinite, glow 3s ease-in-out infinite; }
    @keyframes idle {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      25% { transform: translateY(-3px) rotate(1deg) scale(1.04); }
      50% { transform: translateY(-1px) rotate(2deg) scale(1.07); }
      75% { transform: translateY(-4px) rotate(-1deg) scale(1.03); }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(94, 231, 255, .55)); }
      50% { filter: drop-shadow(0 0 15px rgba(94, 231, 255, .95)); }
    }
    @keyframes glowGold {
      0%, 100% { filter: drop-shadow(0 0 7px rgba(255, 211, 106, .6)); }
      50% { filter: drop-shadow(0 0 17px rgba(255, 211, 106, 1)); }
    }

    /* ---------- Keyframes ---------- */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.75); } }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }
    @keyframes glowIn { 0% { box-shadow: 0 0 0 rgba(94, 231, 255, 0); border-color: var(--cyan); } 30% { box-shadow: 0 0 34px rgba(94, 231, 255, .45); } 100% { box-shadow: 0 0 26px rgba(94, 231, 255, .07); border-color: var(--line); } }

    @media (max-width: 520px) {
      .brand .tag { display: none; }
      .topbar { padding: 12px; gap: 10px; }
      .msg { max-width: 92%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
      #prompt { overflow-y: hidden; scrollbar-width: thin; scrollbar-color: rgba(94, 231, 255, .4) transparent; }
    #prompt::-webkit-scrollbar { width: 6px; }
    #prompt::-webkit-scrollbar-thumb { background: rgba(94, 231, 255, .35); border-radius: 6px; }
    #prompt::-webkit-scrollbar-track { background: transparent; }
      /* tight-bubbles */
    .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
    .msg.user .bubble, .msg.model .bubble { width: fit-content; max-width: 100%; }
    .bubble { text-wrap: pretty; }
  </style>
</head>

<body>
  <canvas id="sparks"></canvas>

  <div class="app">
    <header class="topbar">
      <div class="orb" id="orb">
        <img src="{% static 'chat/icon-192.png' %}" alt="IO"><span class="orbit"><i></i><i></i><i></i></span>
      </div>
      <div class="brand">
        <div class="name">IO</div>
        <div class="tag">The Guardian Wisp &bull; AI assistant</div>
      </div>
      <div class="right">
        <div class="status" id="status" data-state="online">
          <span class="dot"></span>
          <span id="status-text">Online</span>
          <span class="dots" id="status-dots"><i></i><i></i><i></i></span>
        </div>
        <button id="clear" class="btn-clear" type="button" title="Start a fresh conversation">Clear</button>
      </div>
    </header>

    <div class="offline-wrap" id="offline-wrap">
      <div><div class="offline-bar">You are offline. IO needs a connection to answer. Reconnect to continue.</div></div>
    </div>

    <main id="chat"></main>

    <div id="chips">
      <button type="button">Explain photosynthesis simply</button>
      <button type="button">Give me an example</button>
      <button type="button">Quiz me on this topic</button>
      <button type="button">Summarize in 3 points</button>
    </div>

    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Ask IO a question..."></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="footer">Safe Student Mode &bull; Offline PWA</div>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear");
    const chipsEl = document.getElementById("chips");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("status-text");
    const statusDots = document.getElementById("status-dots");
    const orbEl = document.getElementById("orb");
    const offlineWrap = document.getElementById("offline-wrap");
    const AVATAR = "{% static 'chat/icon-192.png' %}";
    const csrf = document.cookie.split("; ").find(c => c.startsWith("csrftoken="))?.split("=")[1];

    let messages = [];
    let busy = false;
    let flashOnline = false;

    /* ---------- Status: online / thinking / offline ---------- */
    function setStatus() {
      const off = !navigator.onLine;
      const state = off ? "offline" : busy ? "thinking" : "online";
      statusEl.dataset.state = state;
      statusText.textContent = off ? "Offline" : busy ? "Thinking" : (flashOnline ? "Back online" : "Online");
      statusDots.classList.toggle("show", state === "thinking");
      orbEl.classList.toggle("thinking", state === "thinking");
      offlineWrap.classList.toggle("show", off);
      sendBtn.disabled = busy || off;
      clearBtn.disabled = busy;
      chipsEl.classList.toggle("off", busy || off);
      promptEl.placeholder = off ? "You are offline..." : "Ask IO a question...";
    }
    addEventListener("offline", () => { flashOnline = false; setStatus(); });
    addEventListener("online", () => {
      flashOnline = true;
      setStatus();
      setTimeout(() => { flashOnline = false; setStatus(); }, 2500);
    });

    /* ---------- Tiny safe markdown ---------- */
    function md(src) {
      const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const inline = s => esc(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
      const out = [];
      let list = null;
      let code = null;
      const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };

      for (const line of src.split("\n")) {
        if (line.trim().startsWith("```")) {
          if (code === null) { closeList(); code = []; }
          else { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
          continue;
        }
        if (code !== null) { code.push(line); continue; }

        const ul = line.match(/^\s*[*-]\s+(.*)/);
        const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
        const h = line.match(/^#{1,6}\s+(.*)/);

        if (ul) {
          if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
          out.push("<li>" + inline(ul[1]) + "</li>");
        } else if (ol) {
          if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
          out.push("<li>" + inline(ol[1]) + "</li>");
        } else {
          closeList();
          if (h) out.push("<p><strong>" + inline(h[1]) + "</strong></p>");
          else if (line.trim()) out.push("<p>" + inline(line) + "</p>");
        }
      }
      closeList();
      if (code !== null) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
      return out.join("");
    }

    /* ---------- Rendering ---------- */
    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    function scrollDown() { chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: "smooth" }); }

    function render(m, fresh) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + m.role + (fresh ? " fresh" : "");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (m.role === "user" ? "You" : m.role === "model" ? "IO" : "System") + " \u00b7 " + m.time;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (m.role === "model") bubble.innerHTML = md(m.text);
      else bubble.textContent = m.text;
      if (m.role === "model") {
        const av = document.createElement("img");
        av.src = AVATAR;
        av.className = "avatar";
        av.alt = "IO";
        wrap.append(av);
      }
      wrap.append(meta, bubble);
      chatEl.append(wrap);
      scrollDown();
      return wrap;
    }

    function welcome() {
      render({
        role: "model",
        time: timeNow(),
        text: "Greetings! I'm **IO**, the guardian wisp and your assistant.\n\nAsk me anything about your lessons and I'll explain it in simple terms. Try one of the suggestions below."
      }, true);
    }

    function showTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg model";
      wrap.innerHTML =
        '<img class="avatar" src="' + AVATAR + '" alt="IO">' +
        '<div class="meta">IO</div>' +
        '<div class="bubble"><div class="think"><span class="think-text">Thinking</span>' +
        '<span class="d"></span><span class="d"></span><span class="d"></span></div></div>';
      chatEl.append(wrap);
      scrollDown();
      return wrap;
    }

    /* ---------- Sending ---------- */
    function buildHistory() {
      const h = messages.filter(m => m.role === "user" || m.role === "model").slice(-10);
      while (h.length && h[0].role !== "user") h.shift();
      return h.map(m => ({ role: m.role, text: m.text }));
    }

    async function send(text) {
      const prompt = (text || promptEl.value).trim();
      if (!prompt || busy || !navigator.onLine) return;

      const history = buildHistory();
      const userMsg = { role: "user", time: timeNow(), text: prompt };
      messages.push(userMsg);
      render(userMsg);
      promptEl.value = "";
      autoGrow();

      busy = true;
      setStatus();
      const typing = showTyping();

      try {
        const res = await fetch("/api/ask/", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
          body: JSON.stringify({ prompt, history })
        });
        const data = await res.json();
        typing.remove();
        if (data.reply) {
          const botMsg = { role: "model", time: timeNow(), text: data.reply };
          messages.push(botMsg);
          render(botMsg, true);
        } else {
          messages.pop();
          render({ role: "error", time: timeNow(), text: data.error || "Something went wrong. Please try again." });
        }
      } catch (e) {
        typing.remove();
        messages.pop();
        render({ role: "error", time: timeNow(), text: "Connection lost. Please try again." });
      } finally {
        busy = false;
        setStatus();
        if (navigator.onLine) promptEl.focus();
      }
    }

    /* ---------- Events ---------- */
    document.getElementById("composer").addEventListener("submit", e => { e.preventDefault(); send(); });
    promptEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    function autoGrow() {
      promptEl.style.height = "auto";
      const max = 140;
      const need = promptEl.scrollHeight + (promptEl.offsetHeight - promptEl.clientHeight);
      promptEl.style.height = Math.min(need, max) + "px";
      promptEl.style.overflowY = need > max ? "auto" : "hidden";
    }
    promptEl.addEventListener("input", autoGrow);

    chipsEl.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => send(b.textContent)));

    clearBtn.addEventListener("click", () => {
      if (busy) return;
      messages = [];
      chatEl.innerHTML = "";
      welcome();
    });

    /* ---------- Floating sparks (Io's spirits) ---------- */
    (function sparks() {
      const c = document.getElementById("sparks");
      if (!c || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const g = c.getContext("2d");
      let w = 0, h = 0;
      const dots = [];
      function size() { w = c.width = innerWidth; h = c.height = innerHeight; }
      size();
      addEventListener("resize", size);
      for (let i = 0; i < 46; i++) {
        dots.push({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          r: Math.random() * 1.8 + 0.5,
          s: Math.random() * 0.35 + 0.1,
          a: Math.random() * Math.PI * 2,
          gold: Math.random() < 0.25
        });
      }
      function tick() {
        g.clearRect(0, 0, w, h);
        for (const d of dots) {
          d.y -= d.s;
          d.a += 0.012;
          d.x += Math.sin(d.a) * 0.25;
          if (d.y < -6) { d.y = h + 6; d.x = Math.random() * w; }
          const alpha = 0.35 + 0.35 * Math.sin(d.a * 2);
          g.beginPath();
          g.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          g.fillStyle = (d.gold ? "rgba(255,211,106," : "rgba(94,231,255,") + alpha + ")";
          g.shadowBlur = 10;
          g.shadowColor = d.gold ? "#ffd36a" : "#5ee7ff";
          g.fill();
        }
        requestAnimationFrame(tick);
      }
      tick();
    })();

    /* Installed window already shows "IO", so keep the page title short there */
    if (matchMedia("(display-mode: standalone)").matches) document.title = "The Guardian Wisp";

    /* ---------- Start ---------- */
    welcome();
    setStatus();
    promptEl.focus();

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
  </script>
</body>

</html>
